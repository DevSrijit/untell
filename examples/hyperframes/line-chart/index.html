<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/CustomEase.min.js"></script>
    <!-- The design systems' renderer and this film's scene (examples/scenes/lineChart.ts), built by scripts/hf_project.ts. -->
    <script src="assets/vs-hyperframes.js"></script>
    <style>* { margin: 0; padding: 0; box-sizing: border-box; } html, body { width: 1080px; height: 1920px; overflow: hidden; }</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920"></div>
    <script>
      gsap.registerPlugin(CustomEase);
      // The system comes from the URL (?system=graphite) so one page shows the scene in any system.
      const system = new URLSearchParams(location.search).get("system") || "spec";
      const tl = gsap.timeline({ paused: true });
      VS.mount(document.getElementById("root"), { system, fonts: "assets/fonts" }, VS.scene, tl).then(() => {
        tl.to({}, { duration: 0.01 }, 7.99);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
